<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranking · Vestibular+</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css" />
<style>
  .page-wrap { padding: 32px 5%; max-width: 800px; margin: 0 auto; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .back-link { color: var(--text-secondary); font-size: .9rem; }
  .back-link:hover { color: var(--text-primary); }
  .page-title { font-size: 1.8rem; margin-top: 6px; }

  .podio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: end; margin-bottom: 28px; }
  .podio-item { text-align: center; padding: 20px 12px; }
  .podio-item.primeiro { order: 2; padding-top: 30px; border: 1px solid #facc15; }
  .podio-item.segundo { order: 1; }
  .podio-item.terceiro { order: 3; }
  .podio-medalha { font-size: 1.8rem; margin-bottom: 8px; }
  .podio-avatar {
    width: 52px; height: 52px; border-radius: 50%; background: var(--gradient-primary);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-weight: 700; font-size: 1.1rem; margin: 0 auto 10px;
  }
  .podio-nome { font-weight: 700; font-size: .9rem; margin-bottom: 4px; word-break: break-word; }
  .podio-xp { font-size: .78rem; color: var(--text-secondary); }

  .ranking-lista { display: flex; flex-direction: column; gap: 10px; }
  .ranking-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
  .ranking-row.voce { border: 1px solid var(--color-primary-500, #7c3aed); }
  .ranking-pos { width: 24px; text-align: center; font-weight: 700; color: var(--text-secondary); font-size: .95rem; }
  .ranking-avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--gradient-primary);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-weight: 700; font-size: .85rem; flex-shrink: 0;
  }
  .ranking-info { flex: 1; min-width: 0; }
  .ranking-nome { font-weight: 600; font-size: .92rem; }
  .ranking-nivel { font-size: .76rem; color: var(--text-secondary); }
  .ranking-xp { font-weight: 700; font-size: .9rem; flex-shrink: 0; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <a class="back-link" href="./dashboard.html">← Voltar ao dashboard</a>
        <h1 class="page-title">🏆 Ranking</h1>
      </div>
      <button id="theme-toggle" class="icon-btn" style="width:40px;height:40px;border-radius:999px;border:1px solid var(--border-color);background:var(--bg-elevated);cursor:pointer;">🌙</button>
    </div>

    <div class="podio" id="podio"></div>

    <div class="ranking-lista" id="ranking-lista">
      <p class="empty-state">Carregando ranking...</p>
    </div>
  </div>

  <script type="module" src="../scripts/theme.js"></script>
  <script type="module" src="../scripts/ranking.js"></script>
</body>
</html>
