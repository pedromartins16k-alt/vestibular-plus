<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metas · Vestibular+</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css" />
<style>
  .page-wrap { padding: 32px 5%; max-width: 1100px; margin: 0 auto; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .back-link { color: var(--text-secondary); font-size: .9rem; }
  .back-link:hover { color: var(--text-primary); }
  .page-title { font-size: 1.8rem; margin-top: 6px; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .btn-add {
    padding: 10px 18px; border-radius: var(--radius-full); border: none;
    background: var(--gradient-primary); color: #fff; font-weight: 700; font-size: .85rem;
    cursor: pointer; box-shadow: var(--shadow-glow);
  }
  .metas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .meta-card { position: relative; }
  .meta-card.concluida { border: 1px solid #22c55e; }
  .meta-icone { font-size: 1.4rem; margin-bottom: 10px; }
  .meta-descricao { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
  .meta-tipo { font-size: .78rem; color: var(--text-secondary); margin-bottom: 14px; }
  .meta-prog-track { height: 8px; border-radius: var(--radius-full); background: var(--border-color); overflow: hidden; margin-bottom: 8px; }
  .meta-prog-fill { height: 100%; border-radius: var(--radius-full); background: var(--gradient-primary); transition: width .5s ease; }
  .meta-prog-fill.concluida { background: #22c55e; }
  .meta-valores { display: flex; align-items: center; justify-content: space-between; font-size: .82rem; color: var(--text-secondary); }
  .meta-prazo { margin-top: 10px; font-size: .78rem; color: var(--text-secondary); }
  .meta-prazo.atrasada { color: #ef4444; }
  .meta-selo { position: absolute; top: 18px; right: 18px; font-size: 1.2rem; }
  .meta-del { position: absolute; bottom: 18px; right: 18px; color: var(--text-secondary); cursor: pointer; font-size: 1rem; padding: 4px; }
  .meta-del:hover { color: #ef4444; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-content { max-width: 440px; width: 100%; padding: 32px; overflow: visible; }
  .modal-close { float: right; cursor: pointer; font-size: 1.2rem; color: var(--text-secondary); }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
  .form-group input, .form-group select {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-md, 10px);
    border: 1px solid var(--border-color); background: var(--bg-elevated);
    color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: .9rem;
  }
  .date-input-wrapper { position: relative; }
  .date-input-wrapper input[type="text"] { cursor: pointer; }

  /* A posição (lado direito, esquerdo, ou embaixo) é calculada dinamicamente
     pelo JS (função posicionarCalendario em metas.js), pra caber na tela
     tanto no computador quanto no celular. Aqui só o visual base. */
  .calendario-popup {
    display: none; position: absolute; z-index: 60;
    width: 280px; padding: 16px; border-radius: var(--radius-md, 10px);
    border: 1px solid var(--border-color); background: var(--bg-elevated);
    box-shadow: 0 12px 30px rgba(0,0,0,.4);
  }
  .calendario-popup.open { display: block; }

  .calendario-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-weight: 700; font-size: .9rem; text-transform: capitalize; }
  .cal-nav { cursor: pointer; padding: 4px 10px; border-radius: var(--radius-full); user-select: none; }
  .cal-nav:hover { background: var(--glass-bg); }
  .calendario-dias-semana { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: .72rem; color: var(--text-secondary); margin-bottom: 6px; }
  .calendario-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dia {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: .82rem; cursor: pointer; transition: all var(--transition-fast);
  }
  .cal-dia:hover { background: var(--glass-bg); }
  .cal-dia.outro-mes { color: var(--text-secondary); opacity: .35; }
  .cal-dia.hoje { border: 1px solid var(--color-primary-500, #7c3aed); }
  .cal-dia.selecionado { background: var(--gradient-primary); color: #fff; font-weight: 700; }
  .btn-salvar {
    width: 100%; padding: 12px; border-radius: var(--radius-full); border: none;
    background: var(--gradient-primary); color: #fff; font-weight: 700; font-size: .9rem;
    cursor: pointer; margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <a class="back-link" href="./dashboard.html">← Voltar ao dashboard</a>
        <h1 class="page-title">🎯 Metas</h1>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" style="width:40px;height:40px;border-radius:999px;border:1px solid var(--border-color);background:var(--bg-elevated);cursor:pointer;">🌙</button>
        <button class="btn-add" id="btn-add">+ Nova meta</button>
      </div>
    </div>
    <div class="metas-grid" id="metas-grid">
      <p class="empty-state">Carregando metas...</p>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content card">
      <span class="modal-close" id="modal-close">✕</span>
      <h2>Nova meta</h2>
      <div class="form-group">
        <label>Descrição</label>
        <input type="text" id="input-descricao" placeholder="Ex: Resolver 50 questões esse mês" />
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="input-tipo">
          <option value="horas_estudo">Horas de estudo</option>
          <option value="questoes_resolvidas">Questões resolvidas</option>
          <option value="flashcards_revisados">Flashcards revisados</option>
          <option value="simulados_feitos">Simulados feitos</option>
        </select>
      </div>
      <div class="form-group">
        <label>Valor alvo</label>
        <input type="number" id="input-valor-alvo" min="1" placeholder="Ex: 50" />
      </div>
      <div class="form-group">
        <label>Prazo (opcional)</label>
        <div class="date-input-wrapper">
          <input type="text" id="input-prazo-display" placeholder="Selecione uma data" readonly />
          <input type="hidden" id="input-prazo" />
          <div class="calendario-popup" id="calendario-popup">
            <div class="calendario-header">
              <span class="cal-nav" id="cal-prev">‹</span>
              <span id="cal-mes-ano"></span>
              <span class="cal-nav" id="cal-next">›</span>
            </div>
            <div class="calendario-dias-semana">
              <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
            </div>
            <div class="calendario-grid" id="calendario-grid"></div>
          </div>
        </div>
      </div>
      <button class="btn-salvar" id="btn-salvar">Salvar</button>
    </div>
  </div>

  <script type="module" src="../scripts/theme.js"></script>
  <script type="module" src="../scripts/metas.js"></script>
</body>
</html>
