<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progresso · Vestibular+</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css" />
<style>
  .page-wrap { padding: 32px 5%; max-width: 800px; margin: 0 auto; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .back-link { color: var(--text-secondary); font-size: .9rem; }
  .back-link:hover { color: var(--text-primary); }
  .page-title { font-size: 1.8rem; margin-top: 6px; }

  .resumo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .resumo-card { text-align: center; padding: 20px 12px; }
  .resumo-card strong { font-size: 1.6rem; font-family: var(--font-display); display: block; }
  .resumo-card span { color: var(--text-secondary); font-size: .82rem; }

  .progresso-lista { display: flex; flex-direction: column; gap: 14px; }
  .progresso-item { padding: 18px 20px; }
  .progresso-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .progresso-nome { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem; }
  .materia-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .progresso-percentual { font-weight: 700; color: var(--color-primary-500); flex-shrink: 0; }
  .prog-track { height: 8px; border-radius: var(--radius-full); background: var(--border-color); overflow: hidden; margin-bottom: 12px; }
  .prog-fill { height: 100%; border-radius: var(--radius-full); transition: width .6s ease; }
  .progresso-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--text-secondary); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <a class="back-link" href="./dashboard.html">← Voltar ao dashboard</a>
        <h1 class="page-title">📊 Progresso por Matéria</h1>
      </div>
      <button id="theme-toggle" class="icon-btn" style="width:40px;height:40px;border-radius:999px;border:1px solid var(--border-color);background:var(--bg-elevated);cursor:pointer;">🌙</button>
    </div>

    <div class="resumo-grid" id="progresso-resumo"></div>

    <div class="progresso-lista" id="progresso-lista">
      <p class="empty-state">Carregando progresso...</p>
    </div>
  </div>

  <script type="module" src="../scripts/theme.js"></script>
  <script type="module" src="../scripts/progresso.js"></script>
</body>
</html>
