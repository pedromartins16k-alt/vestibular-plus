<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flashcards · Vestibular+</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css" />
<style>
  body { overflow-x: hidden; }
  .bg-blob {
    position: fixed; border-radius: 50%; filter: blur(70px); z-index: -1; pointer-events: none;
    opacity: .5; animation: float 14s ease-in-out infinite;
  }
  .bg-blob.b1 { width: 420px; height: 420px; top: -120px; left: -100px; background: var(--color-primary-500); }
  .bg-blob.b2 { width: 380px; height: 380px; top: 200px; right: -140px; background: var(--color-neon-blue); animation-delay: -6s; }
  .bg-blob.b3 { width: 300px; height: 300px; bottom: -100px; left: 30%; background: var(--color-neon); animation-delay: -3s; opacity: .3; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.08); }
  }

  .page-wrap { padding: 32px 5% 80px; max-width: 900px; margin: 0 auto; position: relative; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .back-link { color: var(--text-secondary); font-size: .9rem; }
  .back-link:hover { color: var(--text-primary); }
  .page-title { font-size: 2rem; margin-top: 6px; display: flex; align-items: center; gap: 10px; }

  .modo-tabs {
    display: inline-flex; gap: 4px; padding: 4px; border-radius: var(--radius-full);
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    margin-bottom: 20px;
  }
  .modo-btn {
    padding: 9px 20px; border-radius: var(--radius-full); border: none; background: transparent;
    color: var(--text-secondary); font-weight: 700; font-size: .85rem; cursor: pointer;
    transition: all var(--transition-fast); font-family: var(--font-body);
  }
  .modo-btn.active { background: var(--gradient-primary); color: #fff; box-shadow: var(--shadow-glow); }

  .filtro-materias { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .chip {
    padding: 8px 16px; border-radius: var(--radius-full); border: 1px solid var(--glass-border);
    background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: .85rem; font-weight: 600; cursor: pointer;
    transition: all var(--transition-fast); display: flex; align-items: center; gap: 6px;
  }
  .chip.active { background: var(--gradient-primary); color: #fff; border-color: transparent; box-shadow: var(--shadow-glow); }

  .stats-bar {
    display: flex; justify-content: center; gap: 32px; margin-bottom: 14px; font-size: .9rem;
    color: var(--text-secondary); padding: 14px 24px; border-radius: var(--radius-full);
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); width: fit-content; margin-left: auto; margin-right: auto;
  }
  .stats-bar strong { color: var(--text-primary); font-size: 1.15rem; font-family: var(--font-display); }

  .progresso-track {
    width: 100%; max-width: 480px; height: 6px; border-radius: var(--radius-full);
    background: var(--border-color); margin: 0 auto 36px; overflow: hidden;
  }
  .progresso-fill {
    height: 100%; border-radius: var(--radius-full); background: var(--gradient-primary);
    width: 0%; transition: width .5s ease;
  }

  .study-area { display: flex; flex-direction: column; align-items: center; gap: 24px; }

 .card-session { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 24px; animation: cardIn .45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes cardIn { from { opacity: 0; transform: translateX(28px) scale(.96); } to { opacity: 1; transform: none; } }

  .flashcard-container { width: 100%; max-width: 480px; height: 300px; perspective: 1400px; cursor: pointer; position: relative; }
  .flashcard-container::before {
    content: ''; position: absolute; inset: -18px; border-radius: calc(var(--radius-lg) + 12px);
    background: var(--gradient-neon); filter: blur(30px); opacity: .35; z-index: -1;
  }
  .flashcard { position: relative; width: 100%; height: 100%; transition: transform .6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius-lg);
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px;
    border: 1px solid transparent;
    background: linear-gradient(var(--bg-elevated), var(--bg-elevated)) padding-box, var(--gradient-primary) border-box;
    box-shadow: var(--shadow-soft);
    font-size: 1.2rem; line-height: 1.5; font-weight: 600; font-family: var(--font-display);
  }
  .flashcard-face.verso {
    transform: rotateY(180deg); color: var(--text-secondary); font-weight: 500; font-size: 1.05rem; font-family: var(--font-body);
    background: linear-gradient(var(--bg-elevated), var(--bg-elevated)) padding-box, var(--gradient-neon) border-box;
  }
  .flashcard-tag { position: absolute; top: 18px; left: 18px; font-size: .72rem; font-weight: 700; padding: 5px 12px; border-radius: var(--radius-full); }
  .flip-hint { position: absolute; bottom: 16px; font-size: .75rem; color: var(--text-secondary); }

  .avaliar-botoes { display: flex; gap: 14px; }
  .btn-avaliar {
    padding: 13px 24px; border-radius: var(--radius-full); border: 1px solid var(--border-color);
    background: var(--bg-elevated); font-size: .9rem; font-weight: 700; cursor: pointer;
    transition: all var(--transition-fast);
  }
  .btn-avaliar.errei { color: #ef4444; }
  .btn-avaliar.errei:hover { background: #ef444422; border-color: #ef4444; transform: translateY(-2px); }
  .btn-avaliar.acertei { color: #22c55e; }
  .btn-avaliar.acertei:hover { background: #22c55e22; border-color: #22c55e; transform: translateY(-2px); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>

  <div class="page-wrap">
    <div class="page-header">
      <div>
        <a class="back-link" href="./dashboard.html">← Voltar ao dashboard</a>
        <h1 class="page-title">🧠 Flashcards</h1>
      </div>
      <button id="theme-toggle" class="icon-btn" style="width:40px;height:40px;border-radius:999px;border:1px solid var(--border-color);background:var(--bg-elevated);cursor:pointer;">🌙</button>
    </div>

    <div class="modo-tabs" id="modo-tabs">
      <button class="modo-btn active" data-modo="revisar">Para revisar</button>
      <button class="modo-btn" data-modo="sei">Já sei</button>
    </div>

    <div class="filtro-materias" id="filtro-materias">
      <div class="chip active" data-materia="todas">Todas</div>
    </div>

    <div class="stats-bar" id="stats-bar">
      <span><strong id="stat-restantes">0</strong> para revisar</span>
      <span><strong id="stat-revisados">0</strong> revisados hoje</span>
    </div>

    <div class="progresso-track"><div class="progresso-fill" id="progresso-fill"></div></div>

    <div class="study-area" id="study-area">
      <p class="empty-state">Carregando flashcards...</p>
    </div>
  </div>

  <script type="module" src="../scripts/theme.js"></script>
  <script type="module" src="../scripts/flashcards.js"></script>
</body>
</html>
