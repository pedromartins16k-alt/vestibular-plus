<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flashcards · Vestibular+</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css" />
<style>
  .page-wrap { padding: 32px 5%; max-width: 900px; margin: 0 auto; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .back-link { color: var(--text-secondary); font-size: .9rem; }
  .back-link:hover { color: var(--text-primary); }
  .page-title { font-size: 1.8rem; margin-top: 6px; }
  .filtro-materias { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .chip {
    padding: 8px 16px; border-radius: var(--radius-full); border: 1px solid var(--border-color);
    background: var(--bg-elevated); font-size: .85rem; font-weight: 600; cursor: pointer;
    transition: all var(--transition-fast); display: flex; align-items: center; gap: 6px;
  }
  .chip.active { background: var(--gradient-primary); color: #fff; border-color: transparent; box-shadow: var(--shadow-glow); }

  .stats-bar { display: flex; justify-content: center; gap: 24px; margin-bottom: 28px; font-size: .9rem; color: var(--text-secondary); }
  .stats-bar strong { color: var(--text-primary); font-size: 1.1rem; }

  .study-area { display: flex; flex-direction: column; align-items: center; gap: 24px; }

  .flashcard-container { width: 100%; max-width: 480px; height: 280px; perspective: 1200px; cursor: pointer; }
  .flashcard { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-face {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px;
    border: 1px solid var(--border-color); background: var(--bg-elevated);
    font-size: 1.15rem; line-height: 1.5; font-weight: 600;
  }
  .flashcard-face.verso { transform: rotateY(180deg); color: var(--text-secondary); font-weight: 500; font-size: 1rem; }
  .flashcard-tag { position: absolute; top: 16px; left: 16px; font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-full); }
  .flip-hint { position: absolute; bottom: 14px; font-size: .75rem; color: var(--text-secondary); }

  .avaliar-botoes { display: flex; gap: 14px; }
  .btn-avaliar {
    padding: 12px 22px; border-radius: var(--radius-full); border: 1px solid var(--border-color);
    background: var(--bg-elevated); font-size: .9rem; font-weight: 700; cursor: pointer;
    transition: all var(--transition-fast);
  }
  .btn-avaliar.errei { color: #ef4444; }
  .btn-avaliar.errei:hover { background: #ef444422; border-color: #ef4444; }
  .btn-avaliar.acertei { color: #22c55e; }
  .btn-avaliar.acertei:hover { background: #22c55e22; border-color: #22c55e; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <div>
        <a class="back-link" href="./dashboard.html">← Voltar ao dashboard</a>
        <h1 class="page-title">🧠 Flashcards</h1>
      </div>
      <button id="theme-toggle" class="icon-btn" style="width:40px;height:40px;border-radius:999px;border:1px solid var(--border-color);background:var(--bg-elevated);cursor:pointer;">🌙</button>
    </div>

    <div class="filtro-materias" id="filtro-materias">
      <div class="chip active" data-materia="todas">Todas</div>
    </div>

    <div class="stats-bar" id="stats-bar">
      <span><strong id="stat-restantes">0</strong> para revisar</span>
      <span><strong id="stat-revisados">0</strong> revisados hoje</span>
    </div>

    <div class="study-area" id="study-area">
      <p class="empty-state">Carregando flashcards...</p>
    </div>
  </div>

  <script type="module" src="../scripts/theme.js"></script>
  <script type="module" src="../scripts/flashcards.js"></script>
</body>
</html>
