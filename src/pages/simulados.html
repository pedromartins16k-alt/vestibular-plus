<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centro de Provas · Simulados · Vestibular+</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css" />
<style>
  /* ==========================================================================
     CENTRO DE PROVAS / SIMULADOS — ESTILOS
     ========================================================================== */
  .page-wrap {
    padding: 24px 4% 64px;
    max-width: 1040px;
    margin: 0 auto;
    width: 100%;
  }

  /* CABEÇALHO DO CENTRO DE PROVAS */
  .sim-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .sim-title-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .back-link {
    color: var(--text-secondary);
    font-size: 0.86rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color var(--transition-fast);
  }
  .back-link:hover { color: var(--text-primary); }
  .sim-title {
    font-size: 1.85rem;
    font-weight: 800;
    line-height: 1.2;
    margin: 0;
    color: var(--text-primary);
  }

  /* ABAS PRINCIPAIS: DISPONÍVEIS & HISTÓRICO */
  .nav-tabs-bar {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 24px;
    padding-bottom: 2px;
  }
  .nav-tab-btn {
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-secondary);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .nav-tab-btn:hover {
    color: var(--text-primary);
  }
  .nav-tab-btn.active {
    color: var(--color-primary-400);
    border-bottom-color: var(--color-primary-500);
  }

  /* FILTROS E PESQUISA */
  .sim-filtros-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    background: var(--bg-elevated);
    padding: 12px 18px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
  }
  .filtros-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 7px 14px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
    color: var(--text-secondary);
  }
  .chip:hover {
    border-color: var(--color-primary-400);
    color: var(--text-primary);
  }
  .chip.active {
    background: var(--gradient-primary);
    color: #fff;
    border-color: transparent;
    box-shadow: var(--shadow-glow);
  }

  /* LISTAGEM DE CARDS DE SIMULADO */
  .simulados-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 20px;
  }
  .simulado-card {
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .simulado-card:hover {
    transform: translateY(-2px);
    border-color: var(--border-color-hover);
    box-shadow: var(--shadow-card);
  }
  .simulado-card.bloqueado {
    opacity: 0.85;
    border-style: dashed;
  }
  .simulado-card h3 {
    font-size: 1.18rem;
    margin-bottom: 8px;
    line-height: 1.35;
    font-family: var(--font-display);
  }
  .simulado-card p {
    color: var(--text-secondary);
    font-size: 0.88rem;
    margin-bottom: 16px;
    line-height: 1.5;
    flex-grow: 1;
  }
  .simulado-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    align-items: center;
  }
  .badge-dificuldade, .badge-vestibular, .badge-questoes {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge-facil { background: rgba(34,197,94,.15); color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
  .badge-medio { background: rgba(124,58,237,.15); color: #a78bfa; border: 1px solid rgba(124,58,237,.3); }
  .badge-dificil { background: rgba(245,158,11,.15); color: #f59e0b; border: 1px solid rgba(245,158,11,.3); }
  .badge-genio { background: rgba(239,68,68,.15); color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
  .badge-vestibular { background: rgba(255,255,255,.07); color: var(--text-secondary); border: 1px solid var(--border-color); }
  .badge-questoes { background: rgba(56,189,248,.12); color: #38bdf8; border: 1px solid rgba(56,189,248,.3); }

  .simulado-meta-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.83rem;
    color: var(--text-secondary);
    padding: 10px 0;
    border-top: 1px solid var(--border-color);
    margin-bottom: 16px;
  }

  /* BARRA FIXA DO SIMULADO EM ANDAMENTO (EXAM TOPBAR) */
  .exam-topbar {
    position: sticky;
    top: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 12px 20px;
    margin-bottom: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    flex-wrap: wrap;
    gap: 12px;
  }
  .exam-info-header {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .timer-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: var(--radius-full);
    font-family: var(--font-mono, monospace);
    font-size: 1.15rem;
    font-weight: 800;
    background: rgba(239,68,68,0.12);
    color: #ef4444;
    border: 1px solid rgba(239,68,68,0.3);
    transition: all var(--transition-fast);
  }
  .timer-box.timer-warning {
    background: rgba(245,158,11,0.15);
    color: #f59e0b;
    border-color: rgba(245,158,11,0.4);
    animation: pulseWarn 1.5s infinite;
  }
  .timer-box.timer-critical {
    background: rgba(239,68,68,0.25);
    color: #ef4444;
    border-color: #ef4444;
    animation: pulseWarn 0.8s infinite;
  }
  @keyframes pulseWarn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  /* MAPA DE QUESTÕES (MATRIZ) */
  .matriz-questoes-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .matriz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.88rem;
    font-weight: 700;
  }
  .matriz-legenda {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--text-secondary);
  }
  .legenda-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dot-legenda {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .matriz-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 160px;
    overflow-y: auto;
    padding: 4px;
  }
  .matriz-btn {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    background: var(--bg-elevated);
    color: var(--text-secondary);
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .matriz-btn:hover {
    border-color: var(--color-primary-400);
    color: var(--text-primary);
  }
  .matriz-btn.atual {
    border: 2px solid var(--color-primary-400) !important;
    font-weight: 900;
    transform: scale(1.08);
    box-shadow: 0 0 10px rgba(124,58,237,0.4);
  }
  .matriz-btn.respondida {
    background: rgba(124,58,237,0.2);
    border-color: var(--color-primary-500);
    color: #fff;
  }
  .matriz-btn.marcada {
    border-color: #f59e0b;
    background: rgba(245,158,11,0.18);
    color: #f59e0b;
  }
  .matriz-btn.marcada::after {
    content: '🚩';
    position: absolute;
    top: -5px;
    right: -4px;
    font-size: 0.65rem;
  }

  /* CARD DA QUESTÃO ATIVA */
  .sim-questao-card {
    padding: 32px 28px;
    border-radius: var(--radius-xl);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-card);
    margin-bottom: 24px;
  }
  .questao-top-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .btn-marcar-revisao {
    background: none;
    border: 1px solid var(--border-color);
    padding: 6px 14px;
    border-radius: var(--radius-full);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all var(--transition-fast);
  }
  .btn-marcar-revisao:hover {
    border-color: #f59e0b;
    color: #f59e0b;
  }
  .btn-marcar-revisao.marcado {
    background: rgba(245,158,11,0.15);
    border-color: #f59e0b;
    color: #f59e0b;
  }
  .sim-enunciado {
    font-size: 1.08rem;
    line-height: 1.7;
    color: var(--text-primary);
    margin-bottom: 28px;
    white-space: pre-line;
  }
  .sim-alternativa {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 20px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    background: var(--bg-elevated);
    margin-bottom: 12px;
    cursor: pointer;
    transition: all var(--transition-fast);
  }
  .sim-alternativa:hover {
    border-color: var(--color-primary-400);
    background: rgba(124,58,237,0.06);
    transform: translateX(3px);
  }
  .sim-alternativa.selecionada {
    border-color: var(--color-primary-500);
    background: rgba(124,58,237,0.14);
    box-shadow: 0 0 15px rgba(124,58,237,0.2);
  }
  .sim-alt-letra {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.88rem;
    font-weight: 800;
    flex-shrink: 0;
    transition: all var(--transition-fast);
  }
  .sim-alternativa.selecionada .sim-alt-letra {
    background: var(--color-primary-500);
    border-color: var(--color-primary-500);
    color: #fff;
  }
  .sim-alt-texto {
    font-size: 0.95rem;
    line-height: 1.5;
    padding-top: 4px;
  }

  /* BARRA DE AÇÕES INFERIOR */
  .exam-bottom-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 24px;
  }

  /* MODAIS & OVERLAYS */
  .sim-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    backdrop-filter: blur(8px);
    animation: fadeIn 0.2s ease;
  }
  .sim-modal-content {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-xl);
    max-width: 580px;
    width: 100%;
    padding: 32px 28px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    max-height: 90vh;
    overflow-y: auto;
  }

  /* RESULTADOS & DIAGNÓSTICO */
  .resultado-container {
    animation: fadeIn 0.3s ease;
  }
  .resultado-hero {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-xl);
    padding: 36px 28px;
    text-align: center;
    margin-bottom: 28px;
    box-shadow: var(--shadow-card);
  }
  .resultado-score-big {
    font-size: 3.8rem;
    font-family: var(--font-display);
    font-weight: 900;
    background: var(--gradient-neon);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.1;
    margin: 12px 0;
  }
  .resultado-metricas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-top: 24px;
  }
  .resultado-metrica-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    text-align: center;
  }
  .resultado-metrica-val {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text-primary);
  }
  .resultado-metrica-lbl {
    font-size: 0.78rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  /* HISTÓRICO LIST */
  .historico-table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-xl);
    overflow: hidden;
  }
  .historico-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
    gap: 12px;
  }
  .historico-item:last-child {
    border-bottom: none;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .page-wrap { padding: 16px 4% 48px; }
    .exam-topbar { padding: 10px 14px; }
    .sim-questao-card { padding: 22px 18px; }
    .resultado-score-big { font-size: 3rem; }
  }
</style>
</head>
<body>
  <div class="page-wrap">
    
    <!-- CABEÇALHO SUPERIOR -->
    <header class="sim-header">
      <div class="sim-title-wrap">
        <a class="back-link" href="./dashboard.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Voltar ao Dashboard
        </a>
        <h1 class="sim-title">⏱️ Centro de Provas</h1>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="./mapa-dominio.html" class="btn btn-secondary" style="font-size:0.86rem; padding:8px 14px;">🧬 Mapa de Domínio</a>
        <button id="theme-toggle" class="icon-btn" style="width:40px;height:40px;border-radius:999px;border:1px solid var(--border-color);background:var(--bg-elevated);cursor:pointer;" title="Alternar tema">🌙</button>
      </div>
    </header>

    <!-- NAVEGAÇÃO DE ABAS: SIMULADOS & HISTÓRICO -->
    <div class="nav-tabs-bar" id="main-nav-tabs">
      <button class="nav-tab-btn active" id="tab-btn-disponiveis" data-tab="disponiveis">
        📚 Simulados Oficiais
      </button>
      <button class="nav-tab-btn" id="tab-btn-historico" data-tab="historico">
        📊 Meu Histórico & Evolução
      </button>
    </div>

    <!-- BARRA DE FILTROS (DISPONÍVEL NA ABA DISPONÍVEIS) -->
    <div class="sim-filtros-bar" id="sim-filtros-bar">
      <div class="filtros-tabs" id="filtros-tabs"></div>
      <div style="font-size:0.84rem; color:var(--text-secondary);" id="contador-simulados">
        Carregando provas...
      </div>
    </div>

    <!-- CONTAINER PRINCIPAL DINÂMICO -->
    <main id="conteudo">
      <div class="card" style="padding:48px; text-align:center;">
        <p style="color:var(--text-secondary); font-size:1.05rem;">Carregando Centro de Provas...</p>
      </div>
    </main>

  </div>

  <!-- CONTAINER DE MODAIS (PRE-FLIGHT, REVISÃO PRÉ-SUBMISSAO, UPGRADE) -->
  <div id="modal-container"></div>

  <script type="module" src="../scripts/theme.js"></script>
  <script type="module" src="../scripts/simulados.js"></script>
</body>
</html>
