<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Criar conta · Vestibular+</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css" />
<style>
  .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 24px; }
  .auth-page::before { content: ''; position: absolute; inset: 0; background: var(--gradient-glow); pointer-events: none; }
  .auth-card { width: 100%; max-width: 440px; padding: 40px; position: relative; z-index: 1; }
  .auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .auth-logo .dot { width: 34px; height: 34px; border-radius: 10px; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; box-shadow: var(--shadow-glow); }
  .auth-title { font-size: 1.7rem; margin-bottom: 4px; }
  .auth-subtitle { color: var(--text-secondary); margin-bottom: 28px; font-size: 0.95rem; }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; display: block; }
  .field { display: flex; flex-direction: column; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-secondary); }
  .error-msg { color: var(--color-danger); font-size: 0.85rem; min-height: 18px; }
  .success-msg { color: var(--color-success); font-size: 0.9rem; text-align: center; }
  .btn-full { width: 100%; margin-top: 6px; }
  .hint { font-size: .78rem; color: var(--text-secondary); }

  .password-wrap { position: relative; }
  .password-wrap .input-field { padding-right: 44px; }
  .toggle-senha {
    position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); border-radius: 6px;
  }
  .toggle-senha:hover { color: var(--text-primary); }
  .toggle-senha:focus-visible { outline: 2px solid var(--color-primary-500); outline-offset: 1px; }
  .toggle-senha .icon-eye-off { display: none; }
  .toggle-senha.is-visible .icon-eye { display: none; }
  .toggle-senha.is-visible .icon-eye-off { display: block; }
</style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card glass fade-up" id="auth-card">
      <div class="auth-logo"><div class="dot">V+</div><strong>Vestibular+</strong></div>
      <h1 class="auth-title">Crie sua conta</h1>
      <p class="auth-subtitle">Comece a estudar de graça, agora mesmo.</p>
      <form id="cadastro-form">
        <div class="field">
          <label for="nome">Nome</label>
          <input class="input-field" type="text" id="nome" required placeholder="Seu nome" />
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input class="input-field" type="email" id="email" required placeholder="voce@email.com" />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <div class="password-wrap">
            <input class="input-field" type="password" id="senha" required minlength="6" placeholder="Mínimo 6 caracteres" />
            <button type="button" class="toggle-senha" data-target="senha" aria-label="Mostrar senha">
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 1 12s4 7 11 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            </button>
          </div>
          <span class="hint">Use pelo menos 6 caracteres.</span>
        </div>
        <p class="error-msg" id="error-msg"></p>
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Criar conta</button>
      </form>
      <p class="auth-footer">Já tem conta? <a href="./login.html" style="color:var(--color-primary-500); font-weight:600;">Entrar</a></p>
    </div>
  </div>
  <script type="module" src="../scripts/cadastro.js"></script>
  <script>
    document.querySelectorAll('.toggle-senha').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const mostrando = input.type === 'text';
        input.type = mostrando ? 'password' : 'text';
        btn.classList.toggle('is-visible', !mostrando);
        btn.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
      });
    });
  </script>
</body>
</html>
