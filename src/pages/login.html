
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar · Vestibular+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/base.css" />
<style>
  .auth-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; padding: 24px;
  }
  .auth-page::before {
    content: ''; position: absolute; inset: 0; background: var(--gradient-glow);
    pointer-events: none;
  }
  .auth-card { width: 100%; max-width: 420px; padding: 40px; position: relative; z-index: 1; }
  .auth-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .auth-logo .dot {
    width: 34px; height: 34px; border-radius: 10px; background: var(--gradient-primary);
    display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff;
    box-shadow: var(--shadow-glow);
  }
  .auth-title { font-size: 1.7rem; margin-bottom: 4px; }
  .auth-subtitle { color: var(--text-secondary); margin-bottom: 28px; font-size: 0.95rem; }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; display: block; }
  .field { display: flex; flex-direction: column; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-secondary); }
  .error-msg { color: var(--color-danger); font-size: 0.85rem; min-height: 18px; }
  .btn-full { width: 100%; margin-top: 6px; }
  .forgot-link { text-align: right; font-size: 0.82rem; color: var(--color-secondary-500); }

  .password-wrap { position: relative; }
  .password-wrap .input-field { padding-right: 44px; }
  .toggle-senha {
    position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); border-radius: 6px;
  }
  .toggle-senha:hover { color: var(--text-primary); }
  .toggle-senha:focus-visible { outline: 2px solid var(--color-primary-500); outline-offset: 1px; }
  .toggle-senha .icon-eye-off { display: none; }
  .toggle-senha.is-visible .icon-eye { display: none; }
  .toggle-senha.is-visible .icon-eye-off { display: block; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0; color: var(--text-secondary); font-size: .82rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
  .btn-google {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color);
    background: #fff; color: #1f1f1f; font-weight: 600; font-size: .95rem; cursor: pointer;
    transition: all var(--transition-fast);
  }
  .btn-google:hover { box-shadow: var(--shadow-glow); transform: translateY(-1px); }
  .btn-google:disabled { opacity: .6; cursor: default; transform: none; }
</style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card glass fade-up">
      <div class="auth-logo">
        <div class="dot">V+</div>
        <strong>Vestibular+</strong>
      </div>
      <h1 class="auth-title">Bem-vindo de volta</h1>
      <p class="auth-subtitle">Entre para continuar seus estudos.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input class="input-field" type="email" id="email" required placeholder="voce@email.com" />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <div class="password-wrap">
            <input class="input-field" type="password" id="senha" required placeholder="••••••••" />
            <button type="button" class="toggle-senha" data-target="senha" aria-label="Mostrar senha">
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 1 12s4 7 11 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            </button>
          </div>
        </div>
        <a class="forgot-link" href="./recuperar-senha.html">Esqueceu a senha?</a>
        <p class="error-msg" id="error-msg"></p>
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Entrar</button>
      </form>

      <div class="divider">ou</div>

      <button type="button" class="btn-google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.61z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        <span id="google-btn-text">Entrar com Google</span>
      </button>

      <p class="auth-footer">Não tem conta? <a href="./cadastro.html" style="color:var(--color-primary-500); font-weight:600;">Cadastre-se</a></p>
    </div>
  </div>
  <script type="module" src="../scripts/login.js"></script>
  <script>
    document.querySelectorAll('.toggle-senha').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const mostrando = input.type === 'text';
        input.type = mostrando ? 'password' : 'text';
        btn.classList.toggle('is-visible', !mostrando);
        btn.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
      });
    });
  </script>
</body>
</html>
